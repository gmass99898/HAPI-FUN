<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPI FUN｜台式夾公仔機合作平台</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .hero-logo{
            width:220px;
            max-width:70%;
            margin-bottom:20px;
        }

        .tagline{
            font-size:20px;
            margin-top:10px;
        }

        .branches{
            font-size:18px;
            margin-top:10px;
        }

        .contact-form{
            max-width:600px;
            margin:auto;
        }

        .contact-form label{
            display:block;
            margin-top:20px;
            margin-bottom:8px;
            font-weight:bold;
        }

        .contact-form input[type="text"],
        .contact-form input[type="tel"]{
            width:100%;
            padding:12px;
            border-radius:8px;
            border:1px solid #ccc;
            box-sizing:border-box;
        }

        .checkbox-group{
            margin-top:10px;
        }

        .checkbox-group label{
            display:block;
            margin-bottom:10px;
            font-weight:normal;
        }

        .cta-button{
            margin-top:25px;
            background:#D6006F;
            color:white;
            border:none;
            padding:14px 28px;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
        }

        .cta-button:hover{
            opacity:0.9;
        }

    </style>
</head>

<body>

<header>

    <img
        src="hapi-fun-logo-horizontal-white-2400.png"
        alt="HAPI FUN Logo"
        class="hero-logo">

    <p class="tagline">
        台式夾公仔機經營合作夥伴
    </p>

    <p class="branches">
        深水埗 ｜ 旺角 ｜ 銅鑼灣
    </p>

</header>

<section>

    <h2>關於我們</h2>

    <p>
        HAPI FUN 於香港三大旺區設有地舖，
        專注提供夾公仔機租賃合作方案，
        為合作台主提供場務及技術支援。
    </p>

</section>

<section>

    <h2>店舖位置</h2>

    <ul>
        <li>深水埗福榮街73號地舖</li>
        <li>旺角西洋菜南街164號地舖</li>
        <li>銅鑼灣軒尼詩道482號地舖</li>
    </ul>

</section>

<section>

    <h2>服務內容</h2>

    <ul>
        <li>機台招租</li>
        <li>日常場務支援</li>
        <li>技術維護支援</li>
        <li>兌幣及執台協助</li>
    </ul>

</section>

<section>

    <h2>查詢租機方案</h2>

    <form id="rentalForm" class="contact-form">

        <label for="name">
            客戶稱呼
        </label>

        <input
            type="text"
            id="name"
            required>

        <label for="phone">
            聯絡電話
        </label>

        <input
            type="tel"
            id="phone"
            required>

        <label>
            有興趣分店（可多選）
        </label>

        <div class="checkbox-group">

            <label>
                <input
                    type="checkbox"
                    class="branch"
                    value="銅鑼灣">
                銅鑼灣
            </label>

            <label>
                <input
                    type="checkbox"
                    class="branch"
                    value="旺角">
                旺角
            </label>

            <label>
                <input
                    type="checkbox"
                    class="branch"
                    value="深水埗">
                深水埗
            </label>

        </div>

        <button
            type="submit"
            class="cta-button">

            WhatsApp 查詢租機方案

        </button>

    </form>

</section>

<script>

document
.getElementById("rentalForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const name =
        document.getElementById("name").value;

    const phone =
        document.getElementById("phone").value;

    const branches =
        Array.from(
            document.querySelectorAll(".branch:checked")
        )
        .map(item => item.value)
        .join("、");

    const message =
`你好，

我係 ${name}

電話係 ${phone}

有興趣租用分店：
${branches}

想了解租機方案。`;

    const whatsappUrl =
`https://wa.me/85298502809?text=${encodeURIComponent(message)}`;

    window.open(
        whatsappUrl,
        "_blank"
    );

});

</script>

</body>
</html>
